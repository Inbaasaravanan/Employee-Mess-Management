<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Login</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Outfit", sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(rgba(10, 11, 20, 0.8), rgba(10, 11, 20, 0.88)), url('../assets/abstract_food_bg.png') no-repeat center center fixed;
        background-size: cover;
        overflow: hidden;
        position: relative;
      }
      .card {
        width: 420px;
        padding: 45px 35px;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        position: relative;
        z-index: 10;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .card:hover {
        transform: translateY(-5px);
        border-color: rgba(245, 158, 11, 0.4);
        box-shadow: 0 25px 60px rgba(245, 158, 11, 0.15);
      }
      h1 {
        text-align: center;
        font-size: 2.2rem;
        font-weight: 800;
        color: white;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
        background: linear-gradient(90deg, #ffffff, #cbd5e1);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sub {
        text-align: center;
        color: #cbd5e1;
        margin-bottom: 30px;
        line-height: 1.6;
        font-weight: 500;
      }
      .grp {
        margin-bottom: 22px;
      }
      .grp label {
        display: block;
        color: #f1f5f9;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .grp input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: white;
        font-size: 15px;
        outline: none;
        transition: all 0.25s ease;
      }
      .grp input:focus {
        border-color: #f59e0b;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 14px rgba(245, 158, 11, 0.25);
      }
      .grp input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }
      .opt {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        color: #cbd5e1;
        font-size: 0.9rem;
        font-weight: 500;
      }
      .opt a {
        text-decoration: none;
        color: #fbbf24;
        font-weight: 600;
        transition: color 0.25s ease;
      }
      .opt a:hover {
        color: #f59e0b;
      }
      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #0f172a;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45);
        filter: brightness(1.1);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      .link {
        margin-top: 20px;
        text-align: center;
        color: #cbd5e1;
        font-size: 0.95rem;
        font-weight: 500;
      }
      .link a {
        color: #fbbf24;
        text-decoration: none;
        font-weight: 700;
        transition: color 0.25s ease;
      }
      .link a:hover {
        color: #f59e0b;
      }
      .back {
        text-align: center;
        margin-top: 15px;
      }
      .back a {
        color: rgba(255, 255, 255, 0.45);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        transition: color 0.25s ease;
      }
      .back a:hover {
        color: #fbbf24;
      }
      .msg {
        text-align: center;
        margin-top: 15px;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .err {
        color: #f87171;
      }
      .ok {
        color: #4ade80;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome Back</h1>
      <p class="sub">Sign in to your Employee Mess account</p>
      <div class="grp">
        <label>Email</label
        ><input type="email" id="email" placeholder="Enter your email" />
      </div>
      <div class="grp">
        <label>Password</label
        ><input type="password" id="password" placeholder="Enter password" />
      </div>
      <div class="opt">
        <label><input type="checkbox" /> Remember Me</label
        ><a href="#">Forgot Password?</a>
      </div>
      <button class="btn" id="btn" onclick="login()">Login</button>
      <div class="msg" id="msg"></div>
      <div class="link">
        Don't have an account? <a href="emp.reg.html">Register Here</a>
      </div>
      <div class="back"><a href="../index.html">← Back to Home</a></div>
    </div>
    <script>
      const API =
        window.location.port === "8080" ? "" : "http://localhost:8080";
      async function login() {
        const email = document.getElementById("email").value.trim();
        const pass = document.getElementById("password").value.trim();
        const btn = document.getElementById("btn");
        if (!email || !pass) {
          show("Please fill all fields", "err");
          return;
        }
        btn.disabled = true;
        btn.textContent = "Logging in...";
        try {
          const r = await fetch(`${API}/api/employee/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password: pass }),
          });
          const d = await r.json();
          if (d.success) {
            sessionStorage.setItem("empId", d.id);
            sessionStorage.setItem("empName", d.name);
            sessionStorage.setItem("empDept", d.department);
            sessionStorage.setItem("empEmail", d.email);
            sessionStorage.setItem("empPhone", d.phone);
            show("Login Successful! Redirecting...", "ok");
            setTimeout(() => (location.href = "menubooking.html"), 900);
          } else {
            show(d.message || "Invalid credentials", "err");
            btn.disabled = false;
            btn.textContent = "Login";
          }
        } catch (e) {
          show("Server error. Is backend running on port 8080?", "err");
          btn.disabled = false;
          btn.textContent = "Login";
        }
      }
      function show(t, c) {
        const e = document.getElementById("msg");
        e.textContent = t;
        e.className = "msg " + c;
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });
    </script>
  </body>
</html>
