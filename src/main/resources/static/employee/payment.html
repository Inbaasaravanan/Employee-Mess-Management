<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Outfit", sans-serif;
    }

    body {
      background: linear-gradient(rgba(10, 11, 20, 0.85), rgba(10, 11, 20, 0.92)), url('../assets/dashboard_bg.png') no-repeat center center fixed;
      background-size: cover;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      overflow-x: hidden;
    }

    .box {
      width: 100%;
      max-width: 820px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 45px 35px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    h1 {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .grad {
      background: linear-gradient(90deg, #fbbf24, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 25px;
    }

    .grp {
      display: flex;
      flex-direction: column;
    }

    .grp label {
      margin-bottom: 8px;
      font-weight: 600;
      color: #f1f5f9;
      font-size: 0.95rem;
    }

    .grp input {
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    .grp input:focus {
      border-color: #fbbf24;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.25);
    }

    .grp input::placeholder {
      color: #cbd5e1;
    }

    .bill {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .bill h2 {
      margin-bottom: 20px;
      color: #fbbf24;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .bitem {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-weight: 500;
    }

    .total {
      text-align: right;
      margin-top: 18px;
      font-size: 1.6rem;
      font-weight: 800;
      color: #fbbf24;
    }

    .paybtn {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0f172a;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
      transition: all 0.3s ease;
    }

    .paybtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.45);
    }

    .receipt {
      display: none;
      margin-top: 30px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 30px;
    }

    .receipt h2 {
      color: #34d399;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .receipt p {
      margin-bottom: 12px;
      font-size: 1rem;
      color: #cbd5e1;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
      padding-bottom: 8px;
    }

    .receipt p strong {
      color: #f1f5f9;
    }

    .dlbtn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #10b981;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
      transition: all 0.3s ease;
    }

    .dlbtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.25s ease;
    }

    .back a:hover {
      color: #fbbf24;
    }

    @media (max-width: 700px) {
      .box {
        padding: 25px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <h1><span class="grad">Payment</span> Gateway</h1>
    <p class="sub">
      Verify your booking details and complete payment securely
    </p>
    <div class="grid">
      <div class="grp">
        <label>Name</label><input type="text" id="name" placeholder="Your name" />
      </div>
      <div class="grp">
        <label>Email</label><input type="email" id="email" placeholder="Your email" />
      </div>
      <div class="grp">
        <label>Phone</label><input type="tel" id="phone" placeholder="Phone number" />
      </div>
      <div class="grp">
        <label>Department</label><input type="text" id="dept" placeholder="Department" />
      </div>
      <div class="grp" style="grid-column: 1/3; margin-top: 10px">
        <label>Payment Method</label>
        <div style="display: flex; gap: 15px; margin-top: 5px">
          <label style="
                flex: 1;
                padding: 14px;
                background: rgba(99, 102, 241, 0.1);
                border: 1px solid #6366f1;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                cursor: pointer;
                transition: 0.3s;
                font-weight: 500;
              " id="lblDemo">
            <input type="radio" name="paymethod" value="demo" checked style="accent-color: #6366f1"
              onchange="togglePayMethod('demo')" />
            Demo Sandbox Mode
          </label>
          <label style="
                flex: 1;
                padding: 14px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                cursor: pointer;
                transition: 0.3s;
                font-weight: 500;
              " id="lblRazor">
            <input type="radio" name="paymethod" value="razorpay" style="accent-color: #6366f1"
              onchange="togglePayMethod('razorpay')" />
            Razorpay Gateway
          </label>
        </div>
      </div>
    </div>
    <div class="bill">
      <h2>🛒 Order Summary</h2>
      <div id="billItems"></div>
      <div class="total">Total : ₹<span id="billTotal">0</span></div>
    </div>
    <div id="demoPaySection" style="display: flex; gap: 15px; margin-top: 25px">
      <button class="paybtn" onclick="payDemo('Success')" style="
            margin-top: 0;
            background: linear-gradient(135deg, #10b981, #059669);
            flex: 1;
          ">
        Simulate Success (Demo)
      </button>
      <button class="paybtn" onclick="payDemo('Failed')" style="
            margin-top: 0;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            flex: 1;
          ">
        Simulate Failure (Demo)
      </button>
    </div>
    <button class="paybtn" id="razorPayBtn" onclick="payNow()" style="display: none">
      Pay with Razorpay
    </button>
    <div class="receipt" id="receipt">
      <h2>✅ Payment Successful!</h2>
      <p><strong>Name:</strong> <span id="rname"></span></p>
      <p><strong>Email:</strong> <span id="remail"></span></p>
      <p><strong>Phone:</strong> <span id="rphone"></span></p>
      <p><strong>Amount Paid:</strong> ₹<span id="rtotal"></span></p>
      <p><strong>Transaction ID:</strong> <span id="rtxn"></span></p>
      <button class="dlbtn" onclick="window.print()">Download Receipt</button>
    </div>
    <div class="back"><a href="menubooking.html">← Back to Menu</a></div>
  </div>
  <script>
    const API =
      window.location.port === "8080" ? "" : "http://localhost:8080";
    // Pre-fill from session
    document.getElementById("name").value =
      sessionStorage.getItem("empName") || "";
    document.getElementById("email").value =
      sessionStorage.getItem("empEmail") || "";
    document.getElementById("phone").value =
      sessionStorage.getItem("empPhone") || "";
    document.getElementById("dept").value =
      sessionStorage.getItem("empDept") || "";
    const cart = JSON.parse(sessionStorage.getItem("cart")) || [];
    let total = 0;
    const bl = document.getElementById("billItems");
    cart.forEach((c) => {
      const s = c.price * c.qty;
      total += s;
      bl.innerHTML += `<div class="bitem"><span>${c.name} × ${c.qty}</span><span>₹${s}</span></div>`;
    });
    document.getElementById("billTotal").textContent = total;

    function togglePayMethod(method) {
      const lblDemo = document.getElementById("lblDemo");
      const lblRazor = document.getElementById("lblRazor");
      const demoSection = document.getElementById("demoPaySection");
      const razorBtn = document.getElementById("razorPayBtn");
      if (method === "demo") {
        lblDemo.style.borderColor = "#6366f1";
        lblDemo.style.background = "rgba(99, 102, 241, 0.1)";
        lblRazor.style.borderColor = "rgba(255,255,255,0.1)";
        lblRazor.style.background = "rgba(255,255,255,0.06)";
        demoSection.style.display = "flex";
        razorBtn.style.display = "none";
      } else {
        lblRazor.style.borderColor = "#6366f1";
        lblRazor.style.background = "rgba(99, 102, 241, 0.1)";
        lblDemo.style.borderColor = "rgba(255,255,255,0.1)";
        lblDemo.style.background = "rgba(255,255,255,0.06)";
        demoSection.style.display = "none";
        razorBtn.style.display = "block";
      }
    }

    async function savePayment(txnId, status) {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      try {
        await fetch(`${API}/api/payment/save`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            email,
            phone,
            role: "Employee",
            amount: total,
            razorpayId: txnId || "N/A",
            status,
          }),
        });
      } catch (e) {
        console.warn("Payment save failed", e);
      }
    }

    async function payDemo(status) {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      if (!name || !email || !phone) {
        alert("Please fill all fields");
        return;
      }
      if (total === 0) {
        alert("Cart is empty");
        return;
      }

      const txnId =
        status === "Success"
          ? "demo_txn_" +
          Math.random().toString(36).substring(2, 11).toUpperCase()
          : "CANCELLED";

      await savePayment(txnId, status);
      if (status === "Success") {
        document.getElementById("receipt").style.display = "block";
        document.getElementById("rname").textContent = name;
        document.getElementById("remail").textContent = email;
        document.getElementById("rphone").textContent = phone;
        document.getElementById("rtotal").textContent = total;
        document.getElementById("rtxn").textContent = txnId;
        sessionStorage.removeItem("cart");
      } else {
        alert("Payment Simulation Failed / Cancelled.");
      }
    }

    function payNow() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      if (!name || !email || !phone) {
        alert("Please fill all fields");
        return;
      }
      if (total === 0) {
        alert("Cart is empty");
        return;
      }
      const opt = {
        key: "rzp_test_YourKeyHere", // ← Replace with your Razorpay Test Key
        amount: total * 100,
        currency: "INR",
        name: "Company Mess Management",
        description: "Meal Booking Payment",
        handler: async function (res) {
          await savePayment(res.razorpay_payment_id, "Success");
          document.getElementById("receipt").style.display = "block";
          document.getElementById("rname").textContent = name;
          document.getElementById("remail").textContent = email;
          document.getElementById("rphone").textContent = phone;
          document.getElementById("rtotal").textContent = total;
          document.getElementById("rtxn").textContent =
            res.razorpay_payment_id;
          sessionStorage.removeItem("cart");
        },
        modal: {
          ondismiss: async function () {
            await savePayment("CANCELLED", "Failed");
          },
        },
        prefill: { name, email, contact: phone },
        theme: { color: "#6366f1" },
      };
      new Razorpay(opt).open();
    }
  </script>
</body>

</html>
